name: MIKA Production Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install

    - name: Run Obfuscation Protocol
      run: node build.js

    - name: Upload Secured Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mika-god-mode-build
        path: dist/
        retention-days: 5
